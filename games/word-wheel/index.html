<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>גלגל המילים</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    margin: 0;
    padding: 25px;
    text-align: center;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

h1 {
    font-size: 44px;
    margin-top: 0;
}

input {
    font-size: 22px;
    padding: 12px;
    margin: 7px;
    border: 2px solid #ccc;
    border-radius: 10px;
    width: 70%;
    max-width: 650px;
    direction: rtl;
    text-align: right;
}

button {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.mainButton {
    font-size: 20px;
    padding: 12px 25px;
    margin: 10px;
    background: #315efb;
    color: white;
}

.mainButton:hover {
    background: #2349c7;
}

#category {
    font-size: 27px;
    font-weight: bold;
    margin: 20px 0;
}

#puzzle {
    direction: rtl;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    margin: 35px auto;
    min-height: 100px;
}

.word {
    display: flex;
    direction: rtl;
    gap: 5px;
}

.tile {
    width: 55px;
    height: 65px;
    border: 3px solid #444;
    border-radius: 7px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 39px;
    font-weight: bold;
    box-sizing: border-box;
    cursor: pointer;
    transition: .15s;
}

.tile:hover {
    background: #eef2ff;
    transform: translateY(-2px);
}

.tile.revealed {
    background: #fff5ad;
    cursor: default;
}

#keyboard {
    direction: rtl;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 800px;
    margin: 30px auto 10px;
}

.letterButton {
    width: 55px;
    height: 55px;
    font-size: 26px;
    background: #e5eaf3;
}

.letterButton:hover {
    background: #ccd7ea;
}

.letterButton.correct {
    background: #bfecc8;
    color: #145d25;
}

.letterButton.wrong {
    background: #f2bcbc;
    color: #7c1515;
}

.letterButton:disabled {
    cursor: default;
    opacity: .75;
}

#message {
    font-size: 28px;
    font-weight: bold;
    min-height: 40px;
    margin: 20px;
}

.instructions {
    font-size: 17px;
    color: #666;
    margin-top: 10px;
}

#gameArea {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>גלגל המילים</h1>

<div id="setup">
    <div>
        <input
            id="phraseInput"
            type="password"
            placeholder="הקלד משפט או ביטוי"
        >
    </div>

    <div>
        <input
            id="categoryInput"
            type="text"
            placeholder="קטגוריה / רמז - לא חובה"
        >
    </div>

    <button class="mainButton" id="startButton">
        התחל משחק
    </button>
</div>

<div id="gameArea">

    <div id="category"></div>

    <div id="puzzle"></div>

    <div class="instructions">
        לחץ על אות למטה כדי לגלות את כל האותיות מסוג זה
        <br>
        או לחץ על משבצת כדי לגלות רק אותה
    </div>

    <div id="keyboard"></div>

    <div id="message"></div>

    <button class="mainButton" id="newPuzzle">
        משפט חדש
    </button>

</div>

</div>

<script>
const hebrewLetters = [
"א","ב","ג","ד","ה","ו","ז","ח","ט",
"י","כ","ל","מ","נ","ס","ע","פ","צ",
"ק","ר","ש","ת"
];

let phrase = "";
let guessedLetters = [];
let individuallyRevealed = new Set();

function normalizeLetter(letter) {
    const finals = {
        "ך":"כ",
        "ם":"מ",
        "ן":"נ",
        "ף":"פ",
        "ץ":"צ"
    };

    return finals[letter] || letter;
}

function startGame() {
    phrase =
        document
        .getElementById("phraseInput")
        .value
        .trim();

    const category =
        document
        .getElementById("categoryInput")
        .value
        .trim();

    if (!phrase) {
        alert("נא להקליד משפט");
        return;
    }

    guessedLetters = [];
    individuallyRevealed = new Set();

    document.getElementById("setup").style.display = "none";
    document.getElementById("gameArea").style.display = "block";

    document.getElementById("category").textContent =
        category ? "קטגוריה: " + category : "";

    document.getElementById("message").textContent = "";

    createKeyboard();
    displayPuzzle();
}

function displayPuzzle() {
    const puzzle =
        document.getElementById("puzzle");

    puzzle.innerHTML = "";

    let characterIndex = 0;

    const words = phrase.split(" ");

    words.forEach(wordText => {
        const wordDiv =
            document.createElement("div");

        wordDiv.className = "word";

        [...wordText].forEach(character => {
            const thisIndex = characterIndex;

            const tile =
                document.createElement("div");

            tile.className = "tile";

            if (!isHebrewLetter(character)) {
                tile.textContent = character;
                tile.classList.add("revealed");
            }

            else if (
                guessedLetters.includes(
                    normalizeLetter(character)
                )
                ||
                individuallyRevealed.has(thisIndex)
            ) {
                tile.textContent = character;
                tile.classList.add("revealed");
            }

            else {
                tile.textContent = "";

                tile.addEventListener(
                    "click",
                    function() {
                        revealIndividualLetter(
                            thisIndex
                        );
                    }
                );
            }

            wordDiv.appendChild(tile);
            characterIndex++;
        });

        puzzle.appendChild(wordDiv);

        characterIndex++;
    });

    checkWin();
}

function revealIndividualLetter(index) {
    individuallyRevealed.add(index);
    displayPuzzle();
}

function isHebrewLetter(character) {
    return /[\u05D0-\u05EA]/.test(character);
}

function createKeyboard() {
    const keyboard =
        document.getElementById("keyboard");

    keyboard.innerHTML = "";

    hebrewLetters.forEach(letter => {
        const button =
            document.createElement("button");

        button.textContent = letter;
        button.className = "letterButton";

        button.addEventListener(
            "click",
            function() {
                guessLetter(
                    letter,
                    button
                );
            }
        );

        keyboard.appendChild(button);
    });
}

function guessLetter(letter, button) {
    guessedLetters.push(letter);
    button.disabled = true;

    let found = false;

    [...phrase].forEach(character => {
        if (
            normalizeLetter(character)
            === letter
        ) {
            found = true;
        }
    });

    if (found) {
        button.classList.add("correct");
    }
    else {
        button.classList.add("wrong");
    }

    displayPuzzle();
}

function checkWin() {
    let index = 0;
    let complete = true;

    for (const character of phrase) {
        if (character === " ") {
            index++;
            continue;
        }

        if (
            isHebrewLetter(character)
            &&
            !guessedLetters.includes(
                normalizeLetter(character)
            )
            &&
            !individuallyRevealed.has(index)
        ) {
            complete = false;
        }

        index++;
    }

    if (complete) {
        document
        .getElementById("message")
        .textContent =
        "🎉 כל הכבוד!";

        document
        .querySelectorAll(".letterButton")
        .forEach(button => {
            button.disabled = true;
        });
    }
}

function newPuzzle() {
    phrase = "";
    guessedLetters = [];
    individuallyRevealed = new Set();

    document
        .getElementById("phraseInput")
        .value = "";

    document
        .getElementById("categoryInput")
        .value = "";

    document
        .getElementById("gameArea")
        .style.display = "none";

    document
        .getElementById("setup")
        .style.display = "block";
}

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("newPuzzle")
.addEventListener(
    "click",
    newPuzzle
);
</script>

</body>
</html>
